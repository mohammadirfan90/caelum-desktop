[package]
name = "caelum-desktop"
description = "CAELUM Desktop: Tauri 2 application shell (thin commands, state, windows)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# Distinct from the binary name so the library and executable do not collide.
name = "caelum_desktop_lib"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
caelum-alarms.workspace = true
caelum-core.workspace = true
caelum-domain.workspace = true
# Device runtime channels and timers (the runtime Tauri already uses).
tokio = { version = "1", features = ["sync", "time"] }
# Default features minus `common-controls-v6`: CAELUM has no predefined `about` menu, and that
# feature makes Windows test binaries fail to load (STATUS_ENTRYPOINT_NOT_FOUND).
tauri = { version = "2.12.2", default-features = false, features = ["wry", "compression", "dynamic-acl", "x11", "dbus"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tauri-specta v2 exists only as release candidates: exact pins, used only in src/ipc.rs
# (docs/third-party-risk.md).
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
zeroize = "1.9.1"

[dev-dependencies]
uuid = "1.28.0"

[features]
# Test equipment only. Release builds refuse to compile with it (src/lib.rs, CLAUDE.md rule 3).
test-equipment = ["caelum-core/test-equipment"]

[lints]
workspace = true
