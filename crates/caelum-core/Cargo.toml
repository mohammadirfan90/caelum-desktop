[package]
name = "caelum-core"
description = "Wiring: task supervisor, event bus, configuration, self-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
caelum-domain.workspace = true
caelum-store.workspace = true
caelum-ingest.workspace = true
caelum-signal.workspace = true
caelum-alarms.workspace = true
caelum-ml.workspace = true
caelum-devices.workspace = true
caelum-vehicle.workspace = true
caelum-ground.workspace = true
caelum-mds.workspace = true
caelum-security.workspace = true
caelum-cluster.workspace = true

caelum-test-equipment = { workspace = true, optional = true }

# Free disk space for the storage watchdog (F-SYS-09); pure Rust, MIT OR Apache-2.0.
fs4 = "1.1"
serde_json = "1.0.151"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4"] }


[features]
# Test equipment only; release builds must not enable it (CLAUDE.md rule 3).
test-equipment = ["dep:caelum-test-equipment", "caelum-domain/test-equipment", "caelum-store/test-equipment", "caelum-ingest/test-equipment"]

[lints]
workspace = true

[dev-dependencies]
cargo_metadata = "0.23.1"
caelum-test-equipment.workspace = true
zeroize = "1.9.1"
