[package]
name = "caelum-cluster"
description = "Primary/standby fail-over and crew-station LAN service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# Network and crypto dependencies approved by CR-017 (CLAUDE.md stack, CR-003 §5).
[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
caelum-domain.workspace = true
caelum-security.workspace = true
ed25519-dalek = { version = "3", features = ["zeroize"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "server-auto", "service", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tracing = "0.1.44"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[lints]
workspace = true
