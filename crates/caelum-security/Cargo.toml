[package]
name = "caelum-security"
description = "Users, roles, sessions, keystore, signing and the audit chain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.6"
caelum-domain.workspace = true
caelum-store.workspace = true
ed25519-dalek = { version = "3", features = ["zeroize"] }
getrandom = "0.4"
keyring-core = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = "1"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = "1"
