[package]
name = "caelum-devices"
description = "Device adapters: BLE, pairing, USB/serial, GHS, SIG profiles, DICOM, ECG, FHIR import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
caelum-domain.workspace = true
caelum-ingest.workspace = true
caelum-store.workspace = true
# Stack item (CLAUDE.md): BLE central on WinRT, BlueZ and CoreBluetooth.
btleplug = "0.13.4"
futures = "0.3"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
# Stack item (CLAUDE.md); MPL-2.0, allowed per crate in deny.toml. No libudev: nothing to install.
serialport = { version = "4.10.1", default-features = false }
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4"] }


[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
# Stack item (CLAUDE.md): WinRT pairing. Same version btleplug uses.
windows = { version = "0.62.2", features = ["Devices_Bluetooth", "Devices_Enumeration", "Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Stack item (CLAUDE.md): BlueZ pairing.
bluer = { version = "0.17", features = ["bluetoothd"] }
