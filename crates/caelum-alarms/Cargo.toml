[package]
name = "caelum-alarms"
description = "Signed ruleset, deterministic rule engine, escalation and technical alarms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
caelum-domain.workspace = true
# CR-009: ruleset signatures and format.
ed25519-dalek = "3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
thiserror = "2.0.21"
toml = "1"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
proptest = "1.11"

[lints]
workspace = true
