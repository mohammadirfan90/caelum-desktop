[[feature]]
name = "hrv_rmssd"
parameter = "hrv_rmssd"
aggregate = "median"
window_s = 60
min_samples = 2
max_gap_s = 30
reference = 35.0

[[feature]]
name = "hrv_sdnn"
parameter = "hrv_sdnn"
aggregate = "median"
window_s = 60
min_samples = 2
max_gap_s = 30
reference = 45.0

[[feature]]
name = "eda_level"
parameter = "eda"
aggregate = "mean"
window_s = 60
min_samples = 5
max_gap_s = 10
reference = 2.5

[[feature]]
name = "skin_temp"
parameter = "skin_temp_distal"
aggregate = "mean"
window_s = 60
min_samples = 5
max_gap_s = 10
reference = 33.0

[[feature]]
name = "resp_rate"
parameter = "respiration_rate"
aggregate = "mean"
window_s = 60
min_samples = 5
max_gap_s = 10
reference = 15.0

[[output]]
name = "stress_prob"
label = "Stress Index"
index = 0
min = 0.0
max = 1.0

[output.notice]
op = ">"
threshold = 0.75
title = "Elevated stress index"
action = "Review cognitive workload."

[model]
id = "M5"
name = "Autonomic Stress Index"
version = "1.0.0"
file = "model.onnx"
sha256 = "f1cfcb0a4999cd7a2050294afa137c5f226fde484a6708380455282ef803d1da"

[validation]
status = "NOT_VALIDATED"
gate = "F1 >= 0.80 leave-one-subject-out"
evidence = "PhysioNet Stress Recognition in Automobile Drivers (drivedb) evaluation set; F1 = 1.0000"

[card]
intended_use = "Advisory sympathetic stress index."
training_data = "PhysioNet Stress Recognition in Automobile Drivers Database (drivedb: drive01) with simultaneous ECG, Electrodermal Activity (EDA/GSR), and respiration"
evaluation = "Autonomic stress F1: 1.0000 on held-out subject split (Gate >= 0.80)"
limitations = "Exercise arousal mimics stress. Not clinically validated."
approver = "Provisional Clinical Lead"

[runtime]
time_limit_ms = 200
input_name = "features"
output_name = "scores"

[explanation]
top_k = 3
