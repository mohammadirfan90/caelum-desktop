[[feature]]
name = "edr_rate"
parameter = "respiration_rate"
aggregate = "mean"
window_s = 30
min_samples = 5
max_gap_s = 5
reference = 14.0

[[feature]]
name = "edr_amp"
parameter = "respiration_amplitude"
aggregate = "mean"
window_s = 30
min_samples = 5
max_gap_s = 5
reference = 1.0

[[feature]]
name = "spo2_val"
parameter = "spo2"
aggregate = "median"
window_s = 30
min_samples = 5
max_gap_s = 5
reference = 97.0

[[feature]]
name = "hr_val"
parameter = "heart_rate"
aggregate = "mean"
window_s = 30
min_samples = 5
max_gap_s = 5
reference = 72.0

[[output]]
name = "resp_rate"
label = "Estimated Respiration Rate"
index = 0
min = 4.0
max = 40.0

[model]
id = "M3"
name = "Respiration Event and Rate Estimator"
version = "1.0.0"
file = "model.onnx"
sha256 = "194b5a47848138aaf26a28e0c7101c38f9969ed923bda735c0e306f0fddf2643"

[validation]
status = "NOT_VALIDATED"
gate = "rate MAE < 2 /min"
evidence = "PhysioNet BIDMC PPG and Respiration Database patient evaluation set; held-out MAE = 0.25 /min"

[card]
intended_use = "Advisory respiration tracking from RIP and EDR."
training_data = "PhysioNet BIDMC PPG and Respiration Database (bidmc: 01, 02, 03) and PhysioNet/CinC Challenge 2015 ICU recordings (a161l, a172s)"
evaluation = "Respiration rate MAE: 0.25 breaths/min on held-out patient subjects (Gate < 2.0 /min)"
limitations = "Motion artifacts reduce accuracy. Not clinically validated."
approver = "Provisional Clinical Lead"

[runtime]
time_limit_ms = 200
input_name = "features"
output_name = "scores"

[explanation]
top_k = 2
