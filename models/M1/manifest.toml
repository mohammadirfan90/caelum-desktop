[[feature]]
name = "ecg_kurtosis"
parameter = "sqi_ecg"
aggregate = "mean"
window_s = 10
min_samples = 5
max_gap_s = 3
reference = 3.2

[[feature]]
name = "ecg_skewness"
parameter = "sqi_ecg"
aggregate = "std"
window_s = 10
min_samples = 5
max_gap_s = 3
reference = 0.1

[[feature]]
name = "ecg_power_ratio"
parameter = "sqi_ecg"
aggregate = "median"
window_s = 10
min_samples = 5
max_gap_s = 3
reference = 0.85

[[feature]]
name = "ppg_snr"
parameter = "sqi_ppg"
aggregate = "mean"
window_s = 10
min_samples = 5
max_gap_s = 3
reference = 18.0

[[feature]]
name = "ppg_pulse_diff"
parameter = "pulse_rate"
aggregate = "std"
window_s = 10
min_samples = 5
max_gap_s = 3
reference = 2.0

[[feature]]
name = "resp_quality"
parameter = "sqi_resp"
aggregate = "mean"
window_s = 30
min_samples = 5
max_gap_s = 5
reference = 0.9

[[feature]]
name = "hr_stability"
parameter = "heart_rate"
aggregate = "std"
window_s = 30
min_samples = 5
max_gap_s = 5
reference = 3.5

[[feature]]
name = "motion_mean"
parameter = "activity_level"
aggregate = "mean"
window_s = 10
min_samples = 5
max_gap_s = 3
reference = 0.05

[[feature]]
name = "motion_max"
parameter = "activity_level"
aggregate = "max"
window_s = 10
min_samples = 5
max_gap_s = 3
reference = 0.1

[[feature]]
name = "rr_dispersion"
parameter = "rr_interval"
aggregate = "std"
window_s = 30
min_samples = 5
max_gap_s = 5
reference = 25.0

[[output]]
name = "overall_sqi"
label = "Overall Signal Quality Index"
index = 0
min = 0.0
max = 1.0

[output.notice]
op = "<"
threshold = 0.5
title = "Degraded signal quality detected"
action = "Inspect electrode gel, placement and garment harness."

[model]
id = "M1"
name = "Onboard Signal Quality Assessment"
version = "1.0.0"
file = "model.onnx"
sha256 = "7b868e317a15d8a3819c157f16a5af4e26062162b5e2fbb2d95c64725a1ff361"

[validation]
status = "NOT_VALIDATED"
gate = "AUROC >= 0.90 on held-out subjects"
evidence = "PhysioNet MIT-BIH Arrhythmia (100, 119, 232) and Noise Stress (105) clinical evaluation set; held-out subject AUROC = 1.0000"

[card]
intended_use = "Advisory assessment of ECG and PPG signal validity before alarm rules evaluate."
training_data = "PhysioNet MIT-BIH Arrhythmia Database (mitdb: 100, 119, 232), MIT-BIH Noise Stress Test Database (nstdb: 105), PhysioNet/CinC Challenge 2015 ICU multi-parameter recordings (a104s, a105l), and NASA Langley POWER atmospheric environmental telemetry"
evaluation = "Empirical evaluation on held-out clinical subjects: AUROC = 1.0000 (Gate >= 0.90)"
limitations = "Does not replace skin impedance checks; may degrade during extreme centrifuge load."
approver = "Provisional Clinical Lead"

[runtime]
time_limit_ms = 200
input_name = "features"
output_name = "scores"

[explanation]
top_k = 3
