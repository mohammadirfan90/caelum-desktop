[[feature]]
name = "pat_val"
parameter = "pat"
aggregate = "median"
window_s = 60
min_samples = 5
max_gap_s = 10
reference = 220.0

[[feature]]
name = "pulse_rate"
parameter = "pulse_rate"
aggregate = "mean"
window_s = 60
min_samples = 5
max_gap_s = 10
reference = 72.0

[[feature]]
name = "spo2_val"
parameter = "spo2"
aggregate = "median"
window_s = 60
min_samples = 5
max_gap_s = 10
reference = 98.0

[[feature]]
name = "temp_distal"
parameter = "skin_temp_distal"
aggregate = "mean"
window_s = 60
min_samples = 5
max_gap_s = 10
reference = 33.5

[[output]]
name = "bp_trend_sys"
label = "Systolic BP Trend"
index = 0
min = 50.0
max = 260.0
parameter = "bp_trend_systolic"

[model]
id = "M6"
name = "Continuous BP Trend Tracker"
version = "1.0.0"
file = "model.onnx"
sha256 = "55dd857e0ec85bd2f65fdc601b1f17da38658cd9aa5ea55510bd5e3e793570de"

[validation]
status = "NOT_VALIDATED"
gate = "trend direction >= 85 % after calibration"
evidence = "PhysioNet MIT-BIH Polysomnographic Database continuous arterial BP evaluation set; Trend direction concordance = 100.00%"

[card]
intended_use = "Advisory systolic BP trend tracking."
training_data = "PhysioNet MIT-BIH Polysomnographic Database (slpdb: slp01a arterial BP), BIDMC, and NASA OSDR OSD-679 spaceflight vascular perfusion measurements"
evaluation = "Systolic BP trend direction concordance: 100.00% on held-out subject sequences (Gate >= 85%)"
limitations = "Requires cuff calibration once per 48 hours. Not clinically validated."
approver = "Provisional Clinical Lead"

[runtime]
time_limit_ms = 200
input_name = "features"
output_name = "scores"

[explanation]
top_k = 2
