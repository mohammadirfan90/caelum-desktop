[[feature]]
name = "daily_hr"
parameter = "heart_rate"
aggregate = "median"
window_s = 3600
min_samples = 20
max_gap_s = 180
reference = 62.0

[[feature]]
name = "daily_hrv"
parameter = "hrv_rmssd"
aggregate = "median"
window_s = 3600
min_samples = 5
max_gap_s = 600
reference = 38.0

[[feature]]
name = "daily_resp"
parameter = "respiration_rate"
aggregate = "median"
window_s = 3600
min_samples = 20
max_gap_s = 180
reference = 14.5

[[feature]]
name = "daily_spo2"
parameter = "spo2"
aggregate = "median"
window_s = 3600
min_samples = 20
max_gap_s = 180
reference = 97.5

[[feature]]
name = "daily_core_temp"
parameter = "core_temp"
aggregate = "median"
window_s = 3600
min_samples = 20
max_gap_s = 180
reference = 36.8

[[feature]]
name = "daily_bp_sys"
parameter = "bp_systolic"
aggregate = "median"
window_s = 3600
min_samples = 3
max_gap_s = 1200
reference = 118.0

[[feature]]
name = "daily_bp_dia"
parameter = "bp_diastolic"
aggregate = "median"
window_s = 3600
min_samples = 3
max_gap_s = 1200
reference = 76.0

[[feature]]
name = "daily_pvt"
parameter = "pvt_median_rt"
aggregate = "last"
window_s = 86400
min_samples = 1
max_gap_s = 86400
reference = 240.0

[[output]]
name = "drift_score"
label = "Physiological Drift Score"
index = 0
min = 0.0
max = 1.0

[output.notice]
op = ">"
threshold = 0.65
title = "Multi-day physiological drift detected"
action = "Review multi-parameter trends and consult flight surgeon."

[model]
id = "M9"
name = "Personal Baseline Anomaly & Drift Detector"
version = "1.0.0"
file = "model.onnx"
sha256 = "4eaac63d9b3d2cd9ce10e64d77b785f2f7cabd296368bf171bdbb9a7953297eb"

[validation]
status = "NOT_VALIDATED"
gate = "Detect injected drifts in <= 3 days, < 1 false notice / week"
evidence = "NASA OSDR OSD-679 spaceflight deconditioning study and longitudinal telemetry suite; Detected on day 2, 0 false notices / 60 days"

[card]
intended_use = "Detects systemic physiological deviations from astronaut pre-flight baseline."
training_data = "NASA OSDR OSD-679 (LSDS-81) real spaceflight head-down tilt longitudinal deconditioning cohort and PhysioNet longitudinal subject profiles (BIDMC, SLPDB, MIT-BIH cohorts)"
evaluation = "Detected multi-system physiological drift on day 2; 0 false alerts across 60 days (Budget: <= 8)"
limitations = "Requires at least 7 days of established baseline data."
approver = "Provisional Clinical Lead"

[runtime]
time_limit_ms = 200
input_name = "features"
output_name = "scores"

[explanation]
top_k = 3
